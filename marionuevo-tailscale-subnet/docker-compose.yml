version: "3.7"

services:
  tailscale:
    image: tailscale/tailscale:v1.102.3  # versión fijada a propósito, no usar latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    volumes:
      - ${APP_DATA_DIR}/data/state:/var/lib/tailscale
    environment:
      # Imprescindible. Sin esto tailscaled programa iptables-legacy, su cadena
      # nat nunca se aplica y los paquetes se reenvían SIN SNAT: se alcanza el
      # propio nodo pero ninguna otra VLAN.
      TS_DEBUG_FIREWALL_MODE: nftables
    # Se evita el entrypoint containerboot de la imagen: sin TS_AUTHKEY mata
    # `tailscale up` a los 60 s y el contenedor entra en bucle de reinicio.
    entrypoint:
      - /usr/local/bin/tailscaled
      - --statedir=/var/lib/tailscale
      - --tun=tailscale0
      - --port=41641          # puerto fijo, para poder abrirlo y forzar conexión directa
    restart: unless-stopped
