manifestVersion: 1
id: marionuevo-tailscale-subnet
icon: https://raw.githubusercontent.com/marionuevo/nginx-md-umbrel/main/marionuevo-tailscale-subnet/icon.svg
category: networking
name: Tailscale Subnet Router
version: "1.0.0"
tagline: Subnet router de Tailscale para las VLAN de casa
description: >
  Levanta tailscaled como subnet router, anunciando las cinco VLAN de la LAN
  al tailnet. Da acceso remoto a SSH, a la UI del UDM-Pro, a SMB y a
  Wake-on-LAN sin abrir puertos entrantes, esquivando el doble NAT de la
  fibra.


  No tiene interfaz web: se gestiona desde el admin console de Tailscale y,
  para el primer login, con docker exec. Requiere red de host, NET_ADMIN,
  SYS_MODULE y /dev/net/tun, por lo que no puede usar el app_proxy de umbrelOS.


  El ajuste de UDP GRO forwarding no puede aplicarse desde dentro del
  contenedor y sigue viviendo en la unidad systemd tailscale-gro.service.
developer: Mario
dependencies: []
repo: https://github.com/marionuevo/nginx-md-umbrel
support: https://github.com/marionuevo/nginx-md-umbrel
port: 41641
gallery: []
releaseNotes: >
  Primera versión, migrada del stack de docker compose de la fase 1.
  Mantiene la versión de imagen fijada en v1.80.3 y el estado de
  autenticación existente, así que no hace falta reautenticar ni volver a
  aprobar rutas.
