version: "3.7"

services:
  web:
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: on-failure
    ports:
      - "9088:80"
    # umbrelOS 2.0 inyecta estos tres montajes a partir de folderAccess en el
    # manifiesto. No fijar rutas del anfitrión aquí: el usuario elige las
    # carpetas de configuración, sitios y logs desde Ajustes de la app.
