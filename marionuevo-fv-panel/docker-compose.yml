version: "3.7"

services:
  # El proxy de Umbrel deja el panel detrás del login de la propia máquina:
  # sirve también data/config.local.js, que lleva el token de Home Assistant.
  app_proxy:
    environment:
      APP_HOST: marionuevo-fv-panel_web_1
      APP_PORT: 80

  web:
    # La misma imagen fijada por digest que usa Nginx Md.
    image: nginx:alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    restart: on-failure
    stop_grace_period: 5s
    volumes:
      # El panel viene con la app; data/ guarda config.local.js, que no está en
      # git y se escribe a mano en el Umbrel (ver README).
      - ${APP_DATA_DIR}/www:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/data:/config:ro
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
