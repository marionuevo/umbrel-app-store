manifestVersion: 1
id: marionuevo-fv-panel
icon: https://raw.githubusercontent.com/marionuevo/umbrel-app-store/main/marionuevo-fv-panel/icon.svg
category: automation
name: Solar Live
version: "1.5.0"
tagline: Live solar production and home consumption
description: >
  Solar monitoring panel connected to the Home Assistant websocket: energy flows
  between panels, home and grid, production against the inverter limit, autonomy
  and self-consumption, the day's curve with surplus and imports, net balance per
  billing hour, the sun's path and the daily balance in kWh and euros.


  Designed to stay on an iPad. The Home Assistant token is kept in
  data/config.local.js inside the app and is only served after signing in to
  Umbrel; if it is missing, the panel asks for it the first time.
developer: Mario
website: https://github.com/marionuevo/umbrel-app-store
dependencies: []
repo: https://github.com/marionuevo/umbrel-app-store
support: https://github.com/marionuevo/umbrel-app-store/issues
port: 9090
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >
  A Sun hours / 24 h switch on the day curve shows the night and early morning
  too, in both charts. In the sun hours view the curve now starts at 06:00
  instead of at the first solar reading.
