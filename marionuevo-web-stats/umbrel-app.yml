manifestVersion: 1
id: marionuevo-web-stats
icon: https://raw.githubusercontent.com/marionuevo/umbrel-app-store/main/marionuevo-web-stats/icon.svg
category: networking
name: Estadísticas Web
version: "1.1.0"
tagline: Visitas y tráfico de mis webs, casi en tiempo real
description: >
  Lee el log de nginx de la app Nginx Md y construye estadísticas de visitas y
  tráfico de los cinco sitios: páginas vistas, visitantes únicos, países,
  procedencia, navegadores y códigos de respuesta, con un hilo de peticiones en
  directo.


  Separa a las personas de los bots y de los sondeos de vulnerabilidades, que
  en estas webs son la mayor parte del tráfico. La IP real del visitante se
  recupera de la cabecera CF-Connecting-IP que pone Cloudflare: sin eso todas
  las peticiones parecen venir de la pasarela de Docker.


  Requiere que Nginx Md tenga la configuración de registro en JSON
  (00-stats.conf) y su volumen de logs. Los datos no salen de la máquina.
  En umbrelOS 2.0 hay que seleccionar la misma carpeta de logs compartidos que
  usa Nginx Md.
developer: Mario
website: https://github.com/marionuevo/umbrel-app-store
dependencies:
  - marionuevo-nginx-md
repo: https://github.com/marionuevo/umbrel-app-store
support: https://github.com/marionuevo/umbrel-app-store/issues
port: 9089
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
storage:
  dataRoot: data
folderAccess:
  - id: website-logs
    name: Logs web compartidos
    note: Selecciona la misma carpeta de logs elegida en Nginx Md. Debe permitir escritura porque esta app recorta stats.log.
    mounts:
      - service: web
        targetPath: /logs
        readOnly: false
environment:
  - name: TZ
    services: [web]
    default: Europe/Madrid
    note: Zona horaria IANA para las estadísticas.
  - name: WEBSTATS_HOSTS
    services: [web]
    default: 2stops.com,www.2stops.com,bentacu.2stops.com,marionuevo.com,www.marionuevo.com,numediaestudio.com,www.numediaestudio.com,selectosound.com,www.selectosound.com
    note: Lista separada por comas de hosts incluidos en las estadísticas.
  - name: WEBSTATS_RETENTION_DAYS
    services: [web]
    default: "180"
    note: Días de retención de datos agregados.
  - name: WEBSTATS_MAX_LOG_MB
    services: [web]
    default: "256"
    note: Tamaño máximo de stats.log antes de que el seguidor lo recorte.
releaseNotes: >
  Preparación para umbrelOS 2.0: la base de datos puede usar el almacenamiento
  gestionado, los ajustes se editan desde la app y los logs se eligen como una
  carpeta compartida con Nginx Md.
submitter: Mario
submission: https://github.com/marionuevo/umbrel-app-store
